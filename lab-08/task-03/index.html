<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Завдання 3 — Фотогалерея (Непарний варіант)</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="container">
    <section class="gallery" aria-label="Галерея Team Fortress 2 та інтернет-мемів MGE">
      <!-- Верхній ряд: 5 фотографій -->
      <figure class="gallery__item">
        <img src="https://cdn.akamai.steamstatic.com/steam/apps/440/header.jpg" alt="Team Fortress 2 — основні класи MGE 1v1" referrerpolicy="no-referrer" />
      </figure>
      <figure class="gallery__item">
        <img src="https://cdn.akamai.steamstatic.com/steam/apps/440/capsule_616x353.jpg" alt="Team Fortress 2 — Soldier, Heavy та Scout" referrerpolicy="no-referrer" />
      </figure>
      <figure class="gallery__item gallery__item--top">
        <img src="https://cdn.akamai.steamstatic.com/steam/apps/440/library_600x900.jpg" alt="Team Fortress 2 — постер найманців MGE" referrerpolicy="no-referrer" />
      </figure>
      <figure class="gallery__item">
        <img src="https://cdn.akamai.steamstatic.com/steam/apps/440/page_bg_generated_v6b.jpg" alt="Team Fortress 2 — поле бою Badlands" referrerpolicy="no-referrer" />
      </figure>
      <figure class="gallery__item">
        <img src="https://commons.wikimedia.org/wiki/Special:FilePath/Shiba_inu_taiki.jpg?width=800" alt="Doge — класичний інтернет-мем" referrerpolicy="no-referrer" />
      </figure>

      <!-- Центральна панорамна фотографія на всю ширину (5 колонок) -->
      <figure class="gallery__item gallery__item--featured">
        <img src="https://cdn.akamai.steamstatic.com/steam/apps/440/library_hero.jpg" alt="Team Fortress 2 — вся команда найманців" referrerpolicy="no-referrer" />
      </figure>

      <!-- Нижній ряд: 5 фотографій -->
      <figure class="gallery__item gallery__item--top">
        <img src="https://commons.wikimedia.org/wiki/Special:FilePath/Rick_Astley_Dallas.jpg?width=800" alt="Rick Astley — інтернет-мем Rickroll" referrerpolicy="no-referrer" />
      </figure>
      <figure class="gallery__item gallery__item--top">
        <img src="https://commons.wikimedia.org/wiki/Special:FilePath/Grumpy_Cat_by_Gage_Skidmore.jpg?width=800" alt="Grumpy Cat — класичний інтернет-мем" referrerpolicy="no-referrer" />
      </figure>
      <figure class="gallery__item gallery__item--top">
        <img src="https://i.imgflip.com/30b1gx.jpg" alt="Drake Hotline Bling — мем про MGE 1v1" referrerpolicy="no-referrer" />
      </figure>
      <figure class="gallery__item gallery__item--top">
        <img src="https://i.imgflip.com/1bij.jpg" alt="One Does Not Simply — мем про рокетджампи" referrerpolicy="no-referrer" />
      </figure>
      <figure class="gallery__item gallery__item--top">
        <img src="https://i.imgflip.com/26am.jpg" alt="Aliens Guy — мем про MGE браток" referrerpolicy="no-referrer" />
      </figure>
    </section>
  </main>
</body>
</html>
