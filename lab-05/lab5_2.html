<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Лабораторна №5 — Завдання 2: Таблиця тарифів</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- ЖОДНИХ class/id: тільки селектори тегів і псевдокласи. -->
    <table>
        <thead>
            <tr>
                <th scope="col">Оберіть тариф</th>
                <th scope="col">Starter<br>10$</th>
                <th scope="col">Economy<br>20$</th>
                <th scope="col">Standard<br>40$</th>
                <th scope="col">Professional<br>60$</th>
            </tr>
        </thead>
        <tbody>
            <tr><th scope="row">Підтримка</th><td>+</td><td>+</td><td>+</td><td>+</td></tr>
            <tr><th scope="row">Базові функції</th><td>+</td><td>+</td><td>+</td><td>+</td></tr>
            <tr><th scope="row">Аналітика</th><td>−</td><td>−</td><td>+</td><td>+</td></tr>
            <tr><th scope="row">Доступ до API</th><td>−</td><td>+</td><td>−</td><td>+</td></tr>
            <tr><th scope="row">Хмарне сховище</th><td>−</td><td>−</td><td>+</td><td>+</td></tr>
        </tbody>
    </table>
</body>
</html>
