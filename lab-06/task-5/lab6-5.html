<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Лабораторна 6 — Завдання 5: погода</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="weather">
        <!-- чорна картка з температурою -->
        <div class="today">
            <span class="today__temp">17</span>
        </div>

        <!-- хмара: складається з фонового блоку та двох псевдоелементів (:before / :after) -->
        <div class="cloud"></div>

        <!-- кнопки "назад / вперед" напівпрозорі -->
        <div class="arrows">
            <button class="arrows__btn" type="button" aria-label="Попередній день">&larr;</button>
            <button class="arrows__btn arrows__btn--next" type="button" aria-label="Наступний день">&rarr;</button>
        </div>

        <!-- прогноз на тиждень із тінню -->
        <ul class="forecast">
            <li class="forecast__day"><span class="forecast__name">Mon</span><span class="forecast__temp">17°</span></li>
            <li class="forecast__day"><span class="forecast__name">Tue</span><span class="forecast__temp">19°</span></li>
            <li class="forecast__day"><span class="forecast__name">Wed</span><span class="forecast__temp">16°</span></li>
            <li class="forecast__day"><span class="forecast__name">Thu</span><span class="forecast__temp">18°</span></li>
            <li class="forecast__day"><span class="forecast__name">Fri</span><span class="forecast__temp">21°</span></li>
        </ul>
    </div>
</body>
</html>
