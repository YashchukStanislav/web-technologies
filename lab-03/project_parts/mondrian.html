<!doctype html>
<html lang="uk">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Завдання 2</title>
</head>

<body>

<div style="text-align: center;">

    <h1>Завдання 2</h1>

    <table
        cellspacing="0"
        cellpadding="0"
        style="
            margin: 0 auto;
            border-collapse: collapse;
            width: 500px;
            height: 450px;
            background-color: white;
        "
    >

        <tr>
            <td style="border: 8px solid black; width: 70px; background-color: #ffffff;"></td>

            <td colspan="3"
                rowspan="2"
                style="border: 8px solid black; background-color: #ff5b2d;">
            </td>

            <td colspan="2"
                style="border: 8px solid black; background-color: #fffa69; height: 70px;">
            </td>
        </tr>

        <tr>
            <td style="border: 8px solid black; background-color: #ffffff;"></td>

            <td style="border: 8px solid black; background-color: #ffffff;"></td>

            <td style="border: 8px solid black; background-color: #fffa69;"></td>
        </tr>

        <tr>
            <td style="border: 8px solid black; background-color: #ffffff;"></td>

            <td rowspan="2"
                style="border: 8px solid black; background-color: #000000; width: 140px;">
            </td>

            <td colspan="2"
                style="border: 8px solid black; background-color: #ffffff; height: 70px;">
            </td>

            <td colspan="2"
                style="border: 8px solid black; background-color: #ffffff;">
            </td>
        </tr>

        <tr>
            <td rowspan="2"
                style="border: 8px solid black; background-color: #fffa69;">
            </td>

            <td colspan="2"
                style="border: 8px solid black; background-color: #ffffff;">
            </td>

            <td colspan="2"
                rowspan="2"
                style="border: 8px solid black; background-color: #074481;">
            </td>
        </tr>

        <tr>
            <td style="border: 8px solid black; background-color: #000000;"></td>

            <td colspan="2"
                style="border: 8px solid black; background-color: #000000;">
            </td>
        </tr>

    </table>

    <br>

    <a href="../index.html">
        Повернутись на головну
    </a>

</div>

</body>

</html>
